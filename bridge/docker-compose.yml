services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metronome
      POSTGRES_PASSWORD: metronome
      POSTGRES_DB: metronome
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metronome"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
