[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=node_modules/forge-std/src/",
]

[invariant]
runs = 256
depth = 64
fail_on_revert = false
show_metrics = true

[fuzz]
runs = 512

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz/"
